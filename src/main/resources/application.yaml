spring:
  config:
    import: "file:./.env[.properties]"

  datasource:
    url: ${DB_HOST}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true # 캐시가 유효한 동안 DB를 재조회하지 않는다를 보여주기 위함.

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis