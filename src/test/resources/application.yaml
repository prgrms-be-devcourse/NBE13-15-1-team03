# 테스트 전용 설정
# - 개발 DB·.env를 쓰지 않고, 테스트 JVM 안에서 뜨는 H2 인메모리 DB를 사용
spring:
  datasource:
    # mem: 메모리에만 저장, 테스트 JVM이 끝나면 사라짐
    # MODE=MySQL: MySQL 문법·동작에 가깝게 맞춤
    # DB_CLOSE_DELAY=-1: 마지막 연결이 닫혀도 JVM이 끝날 때까지 DB 유지
    url: jdbc:h2:mem:cafe-test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:

  jpa:
    hibernate:
      # 시작할 때 엔티티 기준으로 테이블을 만들고, 끝날 때 지움
      ddl-auto: create-drop
# 외부 게시글 조회(RestClient) 주소
# - @SpringBootTest가 RestClientConfig 빈을 만들 때 필요한 값 (실제 호출하는 테스트는 없음)
# - 실수로 호출되면 진짜 외부 서버 대신 바로 연결 실패하도록 로컬의 닫힌 주소를 넣어 둠
# - ReferenceControllerTest는 @DynamicPropertySource로 모의 서버 주소로 바꿔서 사용
cafe:
  outside:
    base-url: http://127.0.0.1:1
